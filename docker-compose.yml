version: "3"
services:

  gateway:
    image: nginx:1.25-bookworm
    volumes:
      - ./gateway_nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - order-service
      - stock-service
      - payment-service

  order-service:
    build: ./order
    image: order:latest
    environment:
      - GATEWAY_URL=http://gateway:80
      - RABBIT_URL=amqp://guest:guest@message-bus:5672/
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@order-db:5432/order_db
    command: gunicorn -b 0.0.0.0:5000 -w 1 -k uvicorn.workers.UvicornWorker --timeout 30 --log-level=info app:app
    env_file:
      - env/order_redis.env
    depends_on:
      message-bus:
        condition: service_healthy
      order-db:
        condition: service_started

  order-db:
    image: postgres:17.4
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=order_db
    ports:
      - 5432:5432
    volumes:
      - order-db:/var/lib/postgresql/data
    command: >
      postgres -c wal_level=logical
               -c max_replication_slots=10
               -c max_wal_senders=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 1s
      retries: 10

  stock-service:
    build: ./stock
    image: stock:latest
    environment:
      - GATEWAY_URL=http://gateway:80
      - RABBIT_URL=amqp://guest:guest@message-bus:5672/
    command: gunicorn -b 0.0.0.0:5000 -w 3 -k uvicorn.workers.UvicornWorker --timeout 30 --log-level=info app:app
    env_file:
      - env/stock_redis.env
    depends_on:
      message-bus:
        condition: service_healthy
      stock-db:
        condition: service_started

  stock-db:
    image: redis:7.2-bookworm
    command: redis-server --requirepass redis --maxmemory 512mb

  payment-service:
    build: ./payment
    image: user:latest
    environment:
      - GATEWAY_URL=http://gateway:80
      - RABBIT_URL=amqp://guest:guest@message-bus:5672/
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@payment-db:5433/payment_db
    command: gunicorn -b 0.0.0.0:5000 -w 3 -k uvicorn.workers.UvicornWorker --timeout 30 --log-level=info app:app
    env_file:
      - env/payment_redis.env
    depends_on:
      message-bus:
        condition: service_healthy
      payment-db:
        condition: service_started

  payment-db:
    image: postgres:17.4
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=payment_db
    ports:
      - 5433:5433
    volumes:
      - payment-db:/var/lib/postgresql/data
    command: >
      postgres -c wal_level=logical
               -c max_replication_slots=10
               -c max_wal_senders=10
               -c port=5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5433"]
      interval: 10s
      timeout: 1s
      retries: 10

  message-bus:
    image: rabbitmq:3-management-alpine
    ports:
        - 5672:5672
        - 15672:15672
    volumes:
        - ~/.docker-conf/rabbitmq/data/:/var/lib/rabbitmq/
        - ~/.docker-conf/rabbitmq/log/:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  order-debezium:
    image: quay.io/debezium/server:3.1.0.Final
    volumes:
      - ./debezium-config/order.application.properties:/debezium/config/application.properties:readonly
    ports:
      - "8083:8083"
    depends_on:
      message-bus:
        condition: service_healthy
      order-db:
        condition: service_started

  payment-debezium:
    image: quay.io/debezium/server:3.1.0.Final
    volumes:
      - ./debezium-config/payment.application.properties:/debezium/config/application.properties:readonly
    ports:
      - "8084:8084"
    depends_on:
      message-bus:
        condition: service_healthy
      payment-db:
        condition: service_started

volumes:
  order-db:
    external: false
  payment-db:
    external: false
  message-bus:
    external: false