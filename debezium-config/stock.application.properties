debezium.sink.type=rabbitmq
debezium.sink.rabbitmq.connection.host=message-bus
debezium.sink.rabbitmq.connection.port=5672
debezium.sink.rabbitmq.connection.username=guest
debezium.sink.rabbitmq.connection.password=guest
debezium.sink.rabbitmq.connection.virtual.host=/
debezium.sink.rabbitmq.ackTimeout=3000
debezium.sink.rabbitmq.exchange=amq.topic
debezium.sink.rabbitmq.routingKey.source=topic

debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.plugin.name=pgoutput
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=0
debezium.source.database.hostname=stock-db-primary
debezium.source.database.port=5432
debezium.source.database.user=postgres
debezium.source.database.password=postgres
debezium.source.database.dbname=stock_db
debezium.source.topic.prefix=dds
debezium.source.table.include.list=public.outbox

debezium.source.transforms=outbox
debezium.source.transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
debezium.source.transforms.outbox.table.fields.additional.placement=type:header:eventType
debezium.source.transforms.outbox.route.by.field=type
debezium.source.transforms.outbox.route.topic.replacement=$1

debezium.source.value.converter=org.apache.kafka.connect.json.JsonConverter
debezium.source.value.converter.schemas.enable=false

debezium.source.offset.flush.interval.ms=100
debezium.source.poll.interval.ms=100

debezium.format.key=json
debezium.format.value=json

quarkus.log.console.json=false
